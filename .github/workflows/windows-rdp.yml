name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService'

      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Username = "CynetAdmin"
          $Password = "Cynet@2026"

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }
          else {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "Username: $Username"
          Write-Host "Password: $Password"

      - name: 3. Install & Connect Tailscale VPN
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $Installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $TS)) {
            Write-Error "Tailscale was not installed."
            exit 1
          }

          & $TS up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale connection failed."
            exit 1
          }

          Start-Sleep -Seconds 10

          $TSIP = & $TS ip -4

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "       >>> RDP SERVER IS READY! <<<"
          Write-Host "=================================================="
          Write-Host "Tailscale IP : $TSIP"
          Write-Host "RDP Address  : ${TSIP}:3389"
          Write-Host "Username     : CynetAdmin"
          Write-Host "Password     : Cynet@2026"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Open mstsc and connect to:"
          Write-Host "${TSIP}:3389"

      - name: 4. Verify RDP
        shell: powershell
        run: |
          Start-Sleep -Seconds 3

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($Listener) {
            Write-Host "RDP port 3389 is listening."
          }
          else {
            Write-Error "RDP port 3389 is not listening."
            exit 1
          }

      - name: 5. Keep Server Alive
        shell: powershell
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          for ($i = 1; $i -le 360; $i++) {

            $TSIP = & $TS ip -4

            Write-Host "[$i/360] Server running..."
            Write-Host "Tailscale IP: $TSIP"
            Write-Host "RDP: ${TSIP}:3389"

            Start-Sleep -Seconds 60
          }
