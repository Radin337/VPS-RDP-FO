name: Windows RDP via Tailscale (Persistent)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService"

      - name: Create RDP User
        shell: powershell
        run: |
          $Username = "CynetAdmin"
          $Password = "Cynet@2026"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          $ExistingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if (!$ExistingUser) {
              New-LocalUser -Name $Username -Password $SecurePassword -PasswordNeverExpires -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $Username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username
          }
          Write-Host "Username: CynetAdmin"
          Write-Host "Password: Cynet@2026"

      - name: Install Tailscale
        shell: powershell
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"
          if (!(Test-Path $TS)) {
              $Installer = "$env:TEMP\tailscale.msi"
              Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $Installer
              Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$Installer`" /quiet /norestart" -Wait
              Start-Sleep -Seconds 10
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"
          & $TS up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --unattended=true
          Start-Sleep -Seconds 10
          $TSIP = & $TS ip -4
          Write-Host "Tailscale IP: $TSIP"
          Write-Host "RDP Address: ${TSIP}:3389"
          Write-Host "Username: CynetAdmin"
          Write-Host "Password: Cynet@2026"

      - name: Keep RDP Alive
        shell: powershell
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"
          for ($i = 1; $i -le 355; $i++) {
              $TSIP = & $TS ip -4
              if ($i % 10 -eq 0) {
                  Write-Host "[$i/355] RDP ONLINE - IP: $TSIP - $(Get-Date)"
              }
              if ($i -eq 350) {
                  Write-Host "5 MINUTES REMAINING! Auto-restarting soon..."
              }
              Start-Sleep -Seconds 60
          }

      - name: Auto Restart
        if: always()
        shell: powershell
        run: |
          $headers = @{
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "Accept" = "application/vnd.github.v3+json"
          }
          $body = @{ "ref" = "${{ github.ref_name }}" } | ConvertTo-Json
          $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches"
          try {
              Invoke-RestMethod -Method Post -Uri $url -Headers $headers -Body $body
              Write-Host "Next session triggered successfully!"
          } catch {
              Write-Host "Auto-restart failed, schedule will restart in 6 hours."
          }

      - name: Connection Info
        if: always()
        shell: powershell
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"
          $TSIP = & $TS ip -4
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP SERVER IS READY"
          Write-Host "=========================================="
          Write-Host "IP: $TSIP"
          Write-Host "RDP: ${TSIP}:3389"
          Write-Host "User: CynetAdmin"
          Write-Host "Pass: Cynet@2026"
          Write-Host "=========================================="
          Write-Host "Status: Running (6 hours)"
          Write-Host "Auto-Restart: Yes"
          Write-Host "=========================================="
